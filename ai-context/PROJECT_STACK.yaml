required_contracts:
  - "OverlaySnapshot"
  - "BuildingInspector"
  - "AlgorithmSkill"
  - "SignalPlan"
  - "ImpactPreview"
  - "RoadUnlockInspector"
  - "AiComparisonSnapshot"

invariants:
  - "Unity does not calculate traffic results, points, safety, or purchase cost."
  - "Direct edits and AI drafts use the same SignalPlan validation and apply path."
  - "Only one PrimaryMode and one OverlayType are active at a time."
  - "A connection loss pauses city time and blocks mutations; runtime fixture continuation is forbidden."
  - "All real road data, synthetic demand, assumptions, and game values are labeled separately."
  - "No actual Sejong signal control or measured improvement claim."

