schema_version: "1.0"
updated_at: "2026-07-28"

project:
  id: "make-sejong-great-again"
  name: "Make Sejong Great Again"
  product_type: "AI-assisted multi-intersection traffic operations digital-twin prototype"
  authoritative_scope: "Synthetic-data-based five-intersection corridor MVP"
  repository_state: "documentation_only"
  implementation_status_note: "No FastAPI or backend/app implementation was found in repository code search at the time of this update. All backend modules below are planned deliverables, not completed code."
  excluded_claims:
    - "Real-time synchronization with the actual Sejong traffic network"
    - "Direct control of real signal controllers"
    - "Field-level safety certification"
    - "Actual Sejong traffic improvement performance"
  separate_variant:
    name: "RainFlow Sejong"
    note: "docs/09 and docs/10 describe a separate rain and roundabout-focused variant. Do not silently mix its scenario IDs or KPI names into the five-intersection core MVP."

source_precedence:
  - "ai-context/PROJECT_STACK.yaml for fixed implementation choices and AI coding context"
  - "docs/12_TECH_STACK_AND_BACKEND_SCOPE.md for human-readable implementation scope"
  - "docs/11_PROJECT_FEASIBILITY_VALIDATION.md for feasibility, claims, limitations, and safety wording"
  - "docs/04_TECHNICAL_ARCHITECTURE.md for conceptual architecture"
  - "docs/07_BACKLOG.md for work-item framing"

hard_constraints:
  demo_duration_minutes: 3
  intersections: 5
  execution_target: "Windows x64"
  launch_command: "start.bat"
  external_runtime_dependencies: []
  must_run_without:
    - "Internet"
    - "API key"
    - "Node.js installation"
    - "Python installation"
    - "SUMO installation"
  deterministic_execution: true
  fixed_seed_required: true
  human_approval_required: true
  safety_guard_must_be_deterministic: true
  live_llm_must_not_be_critical_path: true

technology_stack:
  frontend:
    language: "TypeScript"
    framework: "React"
    build_tool: "Vite"
    state_management: "Zustand or React Context; choose one and do not mix"
    visualization:
      corridor: "Custom SVG five-intersection view"
      charts: "Recharts"
    transport:
      request_response: "REST"
      event_stream: "Server-Sent Events"
    p0_exclusions:
      - "Map tile API"
      - "External CDN"
      - "Mobile-first redesign"
  backend:
    language: "Python"
    runtime_policy: ">=3.11,<3.13"
    framework: "FastAPI"
    schema_validation: "Pydantic v2"
    asgi_server: "Uvicorn"
    persistence: "SQLite with SQLAlchemy 2 repository layer"
    configuration: "pydantic-settings and local environment variables for development only"
    serialization: "JSON"
    logging: "Structured JSON logs"
  simulation:
    engine: "Deterministic custom queue-based corridor simulator"
    network_model: "Directed graph with five intersections and storage-limited links"
    required_mechanics:
      - "Upstream discharge becomes downstream arrival"
      - "Travel-time delay between links"
      - "Turning ratios"
      - "Saturation flow by lane group"
      - "Link storage capacity"
      - "Spillback blocks upstream entry"
      - "Pedestrian calls and wait time"
    random_source: "Python random.Random instantiated per run with recorded seed"
    p0_exclusions:
      - "SUMO runtime"
      - "Microscopic vehicle animation"
      - "Machine-learned traffic prediction"
  candidate_generation:
    method: "Bounded enumerative search"
    allowed_changes:
      - "Phase split adjustment"
      - "Cycle-length adjustment within configured bounds"
      - "Corridor offset adjustment"
    minimum_candidates:
      - "A: aggressive candidate with a reproducible safety violation fixture"
      - "B: safe optimized candidate"
      - "C: conservative recovery candidate close to baseline TOD"
    p0_exclusions:
      - "Reinforcement learning"
      - "Black-box optimization"
      - "Unbounded LLM-generated signal plans"
  ai:
    role:
      - "Traffic-state summary"
      - "Four-perspective candidate review"
      - "Operator-facing explanation"
    perspectives:
      - "traffic_flow"
      - "pedestrian_safety"
      - "emergency_response"
      - "equipment_data_reliability"
    interface: "Provider-neutral LLMClient adapter"
    output_contract: "Pydantic-validated structured JSON"
    prompt_versioning: true
    model_version_recording: true
    record_replay: true
    fallback: "Rule-based explanation plus stored reviewed JSON"
    p0_exclusions:
      - "LangChain"
      - "CrewAI"
      - "Vector database"
      - "Autonomous agent tool execution"
      - "LLM-generated KPI values"
      - "LLM safety decisions"
  safety:
    implementation: "Versioned deterministic Python rule engine"
    required_rules:
      - "PED_MIN_TIME"
      - "GREEN_MIN"
      - "GREEN_MAX"
      - "YELLOW_MIN"
      - "ALL_RED_MIN"
      - "CONFLICT_PHASE"
      - "PHASE_SEQUENCE"
      - "CYCLE_SUM"
      - "SPLIT_CHANGE_LIMIT"
      - "OFFSET_CHANGE_LIMIT"
      - "DATA_STALE"
      - "DEVICE_FAULT"
      - "CANDIDATE_HASH_MISMATCH"
    approval_recheck:
      - "Candidate hash"
      - "Rule-set version"
      - "Data freshness"
      - "Device status"
      - "Approver permission"
  testing:
    unit: "pytest"
    property_based: "Hypothesis"
    api: "FastAPI TestClient or HTTPX"
    frontend_e2e: "Playwright"
    required_test_classes:
      - "Determinism with same seed and input"
      - "Spillback propagation"
      - "KPI calculation"
      - "Known unsafe candidate rejection"
      - "Approval without safety pass is rejected"
      - "Stale data blocks approval"
      - "Candidate hash is rechecked at approval"
      - "Invalid state transition is rejected"
      - "Offline three-minute demo completes"
      - "Displayed KPI equals stored run log"
  packaging:
    backend_binary: "PyInstaller"
    frontend_delivery: "Vite static build served by FastAPI"
    launcher: "start.bat"
    local_address: "127.0.0.1 with automatic free-port selection"
    browser_open: true
    release_directory: "release/windows-x64"
    development_reproduction: "docker compose up --build"

state_machine:
  normal_flow:
    - "CREATED"
    - "PREDICTED"
    - "AI_REVIEWED"
    - "SAFETY_PASSED or SAFETY_REJECTED"
    - "HUMAN_APPROVED or HUMAN_REJECTED"
    - "TWIN_APPLIED"
    - "EVALUATED"
  exception_states:
    - "EXPIRED"
    - "DATA_STALE"
    - "SIMULATION_FAILED"
    - "APPLY_FAILED"
    - "ROLLED_BACK"

p0_api_contract:
  - method: "GET"
    path: "/api/health"
    purpose: "Process, storage, fixture, and optional LLM readiness"
  - method: "GET"
    path: "/api/scenarios"
    purpose: "List fixed synthetic scenarios"
  - method: "POST"
    path: "/api/simulations"
    purpose: "Create a deterministic baseline and candidate prediction run"
  - method: "GET"
    path: "/api/simulations/{run_id}"
    purpose: "Return timeline, proposals, KPI, safety, AI reviews, and source type"
  - method: "GET"
    path: "/api/simulations/{run_id}/events"
    purpose: "Stream playback events using SSE"
  - method: "POST"
    path: "/api/approvals"
    purpose: "Approve or reject one safety-passed candidate after revalidation"
  - method: "POST"
    path: "/api/evaluations"
    purpose: "Apply an approved candidate to a separate evaluation trace"
  - method: "GET"
    path: "/api/audit/{run_id}"
    purpose: "Return or export reproducibility and decision log"

backend_module_map:
  - path: "backend/app/main.py"
    responsibility: "FastAPI app creation, middleware, router registration, static frontend serving"
  - path: "backend/app/api"
    responsibility: "HTTP and SSE endpoints"
  - path: "backend/app/domain"
    responsibility: "Pydantic domain models and enums"
  - path: "backend/app/simulation"
    responsibility: "Network, queue engine, demand traces, spillback, KPI"
  - path: "backend/app/optimization"
    responsibility: "Bounded candidate generation and scoring"
  - path: "backend/app/safety"
    responsibility: "Versioned deterministic rule engine"
  - path: "backend/app/ai"
    responsibility: "LLM adapter, prompts, schemas, four-perspective review, fallback"
  - path: "backend/app/services"
    responsibility: "Run orchestration, state machine, approval, evaluation"
  - path: "backend/app/storage"
    responsibility: "SQLite repositories and audit records"
  - path: "backend/fixtures"
    responsibility: "Scenarios, fixed demand traces, cached simulation, stored AI review"
  - path: "backend/tests"
    responsibility: "Unit, property, API, and contract tests"

backend_p0_deliverables:
  - id: "BE-01"
    name: "Domain schema and fixture validation"
    status: "planned"
    completion: "All scenario, observation, signal-plan, proposal, safety, decision, and evaluation fixtures validate"
  - id: "BE-02"
    name: "Deterministic scenario generator"
    status: "planned"
    completion: "Normal, peak congestion, and incident traces reproduce with fixed seed"
  - id: "BE-03"
    name: "Five-intersection queue and spillback simulator"
    status: "planned"
    completion: "Upstream congestion propagation and downstream storage blocking are observable"
  - id: "BE-04"
    name: "KPI engine"
    status: "planned"
    completion: "Average delay, queue, stop rate, pedestrian wait, and spillback risk use documented formulas and units"
  - id: "BE-05"
    name: "Candidate generator"
    status: "planned"
    completion: "Baseline and A/B/C candidates are produced under bounded parameter rules"
  - id: "BE-06"
    name: "Deterministic safety guard"
    status: "planned"
    completion: "Known violation fixtures are rejected with stable rule codes"
  - id: "BE-07"
    name: "Structured AI review with offline fallback"
    status: "planned"
    completion: "Four reviews use one schema and live failure preserves the same response structure"
  - id: "BE-08"
    name: "Server-side state machine and approval"
    status: "planned"
    completion: "Unsafe, stale, changed, or unapproved candidates cannot reach TWIN_APPLIED"
  - id: "BE-09"
    name: "Evaluation and audit logging"
    status: "planned"
    completion: "Prediction and post-application simulation are separate and one run is replayable from JSON"
  - id: "BE-10"
    name: "REST and SSE API"
    status: "planned"
    completion: "OpenAPI and contract tests cover the fixed P0 endpoints"
  - id: "BE-11"
    name: "Fixture and cached-simulation fallback"
    status: "planned"
    completion: "Demo completes without network, LLM, or simulator availability and displays result source"
  - id: "BE-12"
    name: "Windows executable bundle"
    status: "planned"
    completion: "start.bat opens the UI within 60 seconds on a clean Windows x64 machine"

coding_rules_for_ai:
  - "Do not invent real Sejong sensor data. Use explicitly labeled synthetic fixtures."
  - "Do not hardcode target improvement percentages. Display values computed from stored runs."
  - "Do not let an LLM calculate KPI, generate unrestricted signal plans, or make safety decisions."
  - "Use the same Pydantic schemas for live, cached, and fixture modes."
  - "Record scenario ID, input snapshot, seed, simulator version, rule version, model and prompt version, candidate hash, approval, and KPI."
  - "Every endpoint must return a result_source value: live_simulation, cached_simulation, or fixture."
  - "Keep the main branch runnable in fixture mode even when live components are incomplete."
  - "Prefer pure Python implementations in P0 over heavy native dependencies."
  - "Any conflict with claims or safety limitations must be resolved in favor of docs/11_PROJECT_FEASIBILITY_VALIDATION.md."
