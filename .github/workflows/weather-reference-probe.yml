name: Weather Reference Probe

on:
  push:
    branches:
      - agent/siwoo-weather-reference-selection-20260730
    paths:
      - scripts/fetch_weather_reference.py
      - .github/workflows/weather-reference-probe.yml
  pull_request:
    paths:
      - scripts/fetch_weather_reference.py
      - .github/workflows/weather-reference-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-weather-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Fetch screening data
        env:
          KMA_API_AUTH_KEY: ${{ secrets.KMA_API_AUTH_KEY }}
        run: |
          python scripts/fetch_weather_reference.py --output-dir weather_reference_output

      - name: Show generated files
        run: |
          find weather_reference_output -maxdepth 3 -type f -print -exec wc -c {} \;

      - name: Upload weather reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-reference-output
          path: weather_reference_output/
          if-no-files-found: error
          retention-days: 14

      - name: Confirm committed reference files exist
        run: |
          test -f data/observed/weather_reference/weather_source_manifest.json
          test -f data/observed/weather_reference/processed/dry_candidate_screening.csv

# Generated outputs are intentionally not committed by GITHUB_TOKEN.
# Automatic commits changed retrieval timestamps and could retrigger the PR
# workflow repeatedly. Reviewed outputs already stored in the branch are updated
# only by an explicit human-authored commit after artifact comparison.
