name: Weather Reference Probe

on:
  push:
    branches:
      - agent/siwoo-weather-reference-selection-20260730
    paths:
      - scripts/fetch_weather_reference.py
      - .github/workflows/weather-reference-probe.yml
  pull_request:
    paths:
      - scripts/fetch_weather_reference.py
      - .github/workflows/weather-reference-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-weather-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch screening data
        env:
          KMA_API_AUTH_KEY: ${{ secrets.KMA_API_AUTH_KEY }}
        run: |
          python scripts/fetch_weather_reference.py --output-dir weather_reference_output

      - name: Show generated files
        run: |
          find weather_reference_output -maxdepth 3 -type f -print -exec wc -c {} \;

      - name: Upload weather reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-reference-output
          path: weather_reference_output/
          if-no-files-found: error
          retention-days: 14

      - name: Persist validated outputs on branch
        if: github.event_name == 'push' && github.ref_name == 'agent/siwoo-weather-reference-selection-20260730'
        run: |
          target=data/observed/weather_reference
          rm -rf "$target"
          mkdir -p "$target"
          cp -R weather_reference_output/. "$target"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No generated weather changes to commit."
            exit 0
          fi
          git commit -m "data: store weather reference screening output"
          git push origin HEAD:${{ github.ref_name }}
