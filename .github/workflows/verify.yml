name: Verify TATS

on:
  push:
    branches:
      - main
      - codex/ai-traffic-game-slice
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify TATS source-of-truth boundary
        run: python scripts/verify_tats_structure.py

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q
      - name: Playable map is reproducible from public data
        run: |
          python scripts/build_playable_map.py
          git diff --exit-code -- backend/content/map_eojin_playable.json
