name: Verify TATS structure

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify TATS source-of-truth boundary
        run: python scripts/verify_tats_structure.py
