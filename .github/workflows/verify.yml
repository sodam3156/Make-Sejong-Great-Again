name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-contract:
    name: pytest and contract artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The artifact verifier resolves the last commit that changed its
          # source files, so it needs history beyond the triggering commit.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Verify generated contract artifacts
        run: python scripts/generate_contract_artifacts.py --check
