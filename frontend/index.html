<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainFlow Sejong — 3분 데모</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel-2: #151b28;
    --border: #22293a;
    --text: #e6ebf5;
    --muted: #8a93a8;
    --accent: #4fd1c5;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --blue: #60a5fa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    font-size: 15px;
  }
  .app { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 { font-size: 18px; margin: 0; letter-spacing: 0.3px; }
  header.top .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--muted);
  }
  .badge.fixture { color: var(--yellow); border-color: rgba(251,191,36,0.4); }
  .badge.live { color: var(--blue); border-color: rgba(96,165,250,0.4); }
  .badge.provisional { color: var(--red); border-color: rgba(248,113,113,0.4); }

  .scenario-select {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .scenario-select select {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .scenario-select select:disabled { opacity: 0.5; cursor: not-allowed; }
  .scenario-notice {
    font-size: 12px; color: var(--yellow); margin-top: 6px;
    display: none;
  }
  .scenario-notice.show { display: block; }

  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
  }
  .controls button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .step-dots { display: flex; gap: 6px; margin-left: 4px; flex-wrap: wrap; }
  .step-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--border); cursor: pointer;
    border: 1px solid transparent;
  }
  .step-dot.active { background: var(--accent); }
  .clock { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .state-label {
    font-weight: 700; color: var(--accent); font-size: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--muted); margin: 0 0 10px;
  }

  .corridor-note { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 34px; }
  .corridor-verify { color: var(--muted); font-size: 12px; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); line-height: 1.5; }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .kpi-card .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .kpi-card .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi-card .unit { font-size: 11px; color: var(--muted); margin-left: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr.rejected { background: rgba(248,113,113,0.08); }
  tr.rejected td:first-child { border-left: 3px solid var(--red); }
  tr.chosen td:first-child { border-left: 3px solid var(--green); }
  .pct-good { color: var(--green); font-weight: 600; }
  .pct-bad { color: var(--red); font-weight: 600; }

  .guard-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .guard-card.fail { border-color: rgba(248,113,113,0.5); background: rgba(248,113,113,0.06); }
  .guard-card .head { display: flex; align-items: center; justify-content: space-between; }
  .guard-card .head .name { font-weight: 700; }
  .guard-pass { color: var(--green); font-size: 12px; font-weight: 700; }
  .guard-fail { color: var(--red); font-size: 12px; font-weight: 700; }
  .violation { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .violation code { color: var(--red); background: rgba(248,113,113,0.1); padding: 1px 5px; border-radius: 4px; }

  .approval-box {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px;
  }
  .approval-box dl { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; font-size: 13px; margin: 0 0 12px; }
  .approval-box dt { color: var(--muted); }
  .approval-actions { display: flex; gap: 10px; }
  .btn-approve, .btn-reject {
    padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border);
    font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .btn-approve { background: rgba(52,211,153,0.15); color: var(--green); border-color: rgba(52,211,153,0.4); }
  .btn-reject { background: rgba(248,113,113,0.15); color: var(--red); border-color: rgba(248,113,113,0.4); }
  .btn-approve:hover, .btn-reject:hover { filter: brightness(1.2); }
  .decision-note { margin-top: 10px; font-size: 13px; color: var(--accent); }

  .recovery-side { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .recovery-col { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .recovery-col h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  .recovery-col .row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .improvement-row { margin-top: 10px; font-size: 13px; }
  .improvement-row span.pct { font-weight: 700; }

  footer.note {
    margin-top: 24px; color: var(--muted); font-size: 11px; text-align: center;
    border-top: 1px solid var(--border); padding-top: 12px;
  }

  .svg-wrap { width: 100%; overflow-x: auto; }
  .link-label { fill: var(--muted); font-size: 11px; }
  .ra-label { fill: var(--text); font-size: 13px; font-weight: 700; }
  .link-line { stroke-width: 8; stroke-linecap: round; transition: stroke 0.4s ease; }
  .link-line.blink { animation: blink-anim 0.9s infinite; }
  @keyframes blink-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>RainFlow Sejong — 강우 대응 회랑 관제 데모</h1>
      <div class="sub" id="scenario-sub"></div>
    </div>
    <div class="badges">
      <span class="badge fixture" id="badge-source">result_source: fixture</span>
      <span class="badge provisional">provisional 합성 데이터</span>
    </div>
    <div class="scenario-select">
      <label for="scenario-picker">시나리오</label>
      <select id="scenario-picker">
        <option value="dry_base">dry_base</option>
        <option value="rain_spillback_a" selected>rain_spillback_a</option>
        <option value="rain_spillback_b">rain_spillback_b</option>
      </select>
    </div>
  </header>
  <div class="scenario-notice" id="scenario-notice"></div>

  <div class="controls">
    <button id="btn-prev">← 이전</button>
    <button id="btn-playpause">일시정지</button>
    <button id="btn-next">다음 →</button>
    <div class="step-dots" id="step-dots"></div>
    <span class="state-label" id="state-label"></span>
    <span class="clock" id="clock"></span>
  </div>

  <div class="panel">
    <h2>절재로 회랑 · 성금 – 청사 – 세종교차로</h2>
    <div class="svg-wrap">
      <svg id="corridor-svg" viewBox="0 0 760 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="corridor-note" id="corridor-note"></div>
    <div class="corridor-verify" id="corridor-verify"></div>
  </div>

  <div class="panel">
    <h2>핵심 KPI (현재 run 계산값)</h2>
    <div class="kpi-grid" id="kpi-grid"></div>
  </div>

  <div class="grid">
    <div>
      <div class="panel" id="panel-policy" style="display:none;">
        <h2>대응안 비교 (무대응 대비)</h2>
        <table id="policy-table"></table>
      </div>

      <div class="panel" id="panel-safety" style="display:none;">
        <h2>안전 가드 판정</h2>
        <div id="safety-cards"></div>
      </div>
    </div>

    <div>
      <div class="panel" id="panel-approval" style="display:none;">
        <h2>운영자 승인</h2>
        <div class="approval-box" id="approval-box"></div>
      </div>

      <div class="panel" id="panel-recovery" style="display:none;">
        <h2>회복 비교 (무대응 vs 적용)</h2>
        <div id="recovery-content"></div>
      </div>
    </div>
  </div>

  <footer class="note">
    이 화면은 backend/fixtures/demo_run.json 고정 데이터를 재생하는 3분 데모입니다.
    실제 세종시 실측 데이터가 아니며 시우 검증 전 provisional 수치입니다.
    run_id: <span id="run-id"></span>
  </footer>
</div>

<script src="demo_run.js"></script>
<script>
(function () {
  var FIXTURE = window.DEMO_RUN;
  var DATA = null;
  var MODE = 'fixture'; // 'fixture' | 'live'
  var CURRENT_SCENARIO = 'rain_spillback_a';
  var FIXTURE_TIMEOUT_MS = 5000;

  var timeline = [];
  var totalSteps = 0;
  var STEP_DURATION_MS = 0;

  var idx = 0;
  var playing = true;
  var timer = null;
  var approvalDecision = null; // 'approved' | 'rejected' | null

  var STATE_LABELS = {
    normal: '정상 운영',
    rain_warning: '강우 경보',
    spillback: '역류(spillback) 발생',
    policy_compare: '대응안 비교',
    safety_review: '안전 가드 심사',
    operator_approval: '운영자 승인',
    recovery_compare: '회복 비교'
  };

  // ---- step dots ----
  var dotsWrap = document.getElementById('step-dots');

  function rebuildDots() {
    dotsWrap.innerHTML = '';
    timeline.forEach(function (t, i) {
      var d = document.createElement('div');
      d.className = 'step-dot';
      d.title = t.screen_state;
      d.addEventListener('click', function () {
        playing = false; updatePlayButton(); clearTimeout(timer);
        goTo(i);
      });
      dotsWrap.appendChild(d);
    });
  }

  function updateDots() {
    var dots = dotsWrap.querySelectorAll('.step-dot');
    dots.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
  }

  // ---- corridor SVG ----
  // 내부 키(R1/L12 등)는 엔진 식별자일 뿐이고 화면에는 label 만 그린다.
  // 절재로 회랑 정본 표시명 — 2026-07-29 13:28 실제 세종 도로망 A안 결정.
  var RA_POS = {
    R1: { x: 120, y: 110, label: '성금교차로' },
    R2: { x: 380, y: 110, label: '청사교차로' },
    R3: { x: 640, y: 110, label: '세종교차로' }
  };
  var LINK_DEF = [
    { link_id: 'L12', from: 'R1', to: 'R2', offsetY: 0, label: '성금 → 청사' },
    { link_id: 'L23', from: 'R2', to: 'R3', offsetY: 0, label: '청사 → 세종' },
    { link_id: 'BYPASS', from: 'R1', to: 'R3', offsetY: -70, label: '모형 가정 우회경로' }
  ];

  function occColor(ratio) {
    if (ratio >= 0.95) return 'var(--red)';
    if (ratio >= 0.6) return 'var(--yellow)';
    return 'var(--green)';
  }

  function renderCorridorSVG() {
    var svg = document.getElementById('corridor-svg');
    var parts = [];

    LINK_DEF.forEach(function (l) {
      var a = RA_POS[l.from], b = RA_POS[l.to];
      var midY = 110 + l.offsetY;
      var pathId = 'path-' + l.link_id;
      var d;
      if (l.offsetY === 0) {
        d = 'M ' + a.x + ' ' + a.y + ' L ' + b.x + ' ' + b.y;
      } else {
        d = 'M ' + a.x + ' ' + a.y + ' Q ' + ((a.x + b.x) / 2) + ' ' + midY + ' ' + b.x + ' ' + b.y;
      }
      parts.push('<path id="' + pathId + '" d="' + d + '" fill="none" class="link-line" stroke="var(--border)" />');
      var labelX = (a.x + b.x) / 2;
      var labelY = midY - 12;
      parts.push('<text x="' + labelX + '" y="' + labelY + '" class="link-label" text-anchor="middle">' + l.label + '</text>');
    });

    Object.keys(RA_POS).forEach(function (ra) {
      var p = RA_POS[ra];
      parts.push('<circle cx="' + p.x + '" cy="' + p.y + '" r="26" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2" />');
      parts.push('<text x="' + p.x + '" y="' + (p.y + 44) + '" class="ra-label" text-anchor="middle">' + p.label + '</text>');
    });

    svg.innerHTML = parts.join('\n');
  }

  // 무엇이 공식 자료로 확인된 값이고 무엇이 모형 가정인지 화면에도 남긴다.
  // 응답의 network.verification.note 를 그대로 쓰고 문구를 화면에서 새로 만들지 않는다.
  function renderCorridorVerification() {
    var el = document.getElementById('corridor-verify');
    if (!el) return;
    var v = (DATA.network || {}).verification;
    el.textContent = v && v.note ? v.note : '';
  }

  function updateCorridorState(step) {
    var linkMap = {};
    step.links.forEach(function (l) { linkMap[l.link_id] = l; });

    LINK_DEF.forEach(function (l) {
      var el = document.getElementById('path-' + l.link_id);
      if (!el) return;
      var data = linkMap[l.link_id];
      if (!data) return;
      el.setAttribute('stroke', occColor(data.occupancy_ratio));
      el.classList.toggle('blink', !!data.spillback);
    });

    var noteEl = document.getElementById('corridor-note');
    var labelOf = {};
    LINK_DEF.forEach(function (d) { labelOf[d.link_id] = d.label; });
    var lines = step.links.map(function (l) {
      return (labelOf[l.link_id] || l.link_id) + ': 점유율 ' + Math.round(l.occupancy_ratio * 100) + '%' +
        (l.queue_veh != null ? ', 대기 ' + l.queue_veh + '대' : '') +
        (l.spillback ? ' [역류]' : '');
    }).join(' · ');
    noteEl.textContent = (step.note || '') + '  (' + lines + ')';
  }

  // ---- KPI cards ----
  var KPI_DEFS = [
    { key: 'spillback_time_sec', label: '회랑 Spillback wall-clock', unit: '초' },
    { key: 'recovery_time_sec', label: '회복(60초 연속)', unit: '초' },
    { key: 'total_travel_time_sec', label: '모형 내 누적 체류시간', unit: 'vehicle-seconds' },
    { key: 'worst_approach_delay_sec', label: '최악 진입로 P95 대기 proxy', unit: '초' }
  ];

  function kpiValue(kpi, def) {
    if (def.key === 'recovery_time_sec' && kpi.recovery_observed === false) {
      return '관측창 15분 내 미회복';
    }
    return kpi[def.key] + '<span class="unit">' + def.unit + '</span>';
  }

  function renderKPI(kpi) {
    var grid = document.getElementById('kpi-grid');
    grid.innerHTML = KPI_DEFS.map(function (d) {
      return '<div class="kpi-card"><div class="label">' + d.label + '</div>' +
        '<div class="value">' + kpiValue(kpi, d) + '</div></div>';
    }).join('');
  }

  // ---- policy compare table ----
  function pctSpan(v) {
    if (v == null) return '<span class="pct-neutral">-</span>';
    var cls = v < 0 ? 'pct-good' : (v > 0 ? 'pct-bad' : '');
    var sign = v > 0 ? '+' : '';
    return '<span class="' + cls + '">' + sign + v + '%</span>';
  }

  function renderPolicyTable() {
    var policies = DATA.policies;
    var rows = policies.map(function (p) {
      var rowClass = p.guard.passed === false ? 'rejected' : (p.policy_id === DATA.approval.policy_id ? 'chosen' : '');
      var d = p.delta_vs_no_action || {};
      return '<tr class="' + rowClass + '">' +
        '<td>' + p.label + (p.guard.passed === false ? ' (탈락)' : (p.policy_id === DATA.approval.policy_id ? ' (선택)' : '')) + '</td>' +
        '<td>' + p.kpi.spillback_time_sec + '초</td>' +
        '<td>' + p.kpi.total_travel_time_sec + '초</td>' +
        '<td>' + p.kpi.worst_approach_delay_sec + '초</td>' +
        '<td>' + pctSpan(d.spillback_time_pct) + '</td>' +
        '<td>' + pctSpan(d.total_travel_time_pct) + '</td>' +
        '<td>' + pctSpan(d.worst_approach_delay_pct) + '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('policy-table').innerHTML =
      '<thead><tr><th>정책</th><th>Spillback wall-clock</th><th>누적 체류시간</th><th>P95 대기 proxy</th>' +
      '<th>Δ Spillback</th><th>Δ 통행시간</th><th>Δ 최악지체</th></tr></thead><tbody>' + rows + '</tbody>';
  }

  // ---- safety review ----
  function renderSafetyReview() {
    var wrap = document.getElementById('safety-cards');
    wrap.innerHTML = DATA.policies.map(function (p) {
      var fail = p.guard.passed === false;
      var viol = (p.guard.violations || []).map(function (v) {
        return '<div class="violation"><code>' + v.code + '</code> ' + v.detail + '</div>';
      }).join('');
      return '<div class="guard-card ' + (fail ? 'fail' : '') + '">' +
        '<div class="head"><span class="name">' + p.label + (fail ? ' — 탈락' : '') + '</span>' +
        '<span class="' + (fail ? 'guard-fail' : 'guard-pass') + '">' + (p.guard.passed ? 'PASS' : 'FAIL') + '</span></div>' +
        (p.guard.note ? '<div class="violation">' + p.guard.note + '</div>' : '') +
        viol +
        '</div>';
    }).join('');
  }

  // ---- operator approval ----
  function renderApproval() {
    var box = document.getElementById('approval-box');
    var a = DATA.approval;
    var chosen = DATA.policies.filter(function (p) { return p.policy_id === a.policy_id; })[0];
    box.innerHTML =
      '<dl>' +
      '<dt>대상 정책</dt><dd>' + (chosen ? chosen.label : a.policy_id) + '</dd>' +
      '<dt>제안 상태</dt><dd>' + a.status + '</dd>' +
      '<dt>운영자</dt><dd>' + (a.operator || '-') + '</dd>' +
      '<dt>근거</dt><dd>' + (a.reason || '-') + '</dd>' +
      '</dl>'.replace('<dl>', '<dl style="margin-bottom:12px">') +
      '<div class="approval-actions">' +
      '<button class="btn-approve" id="btn-approve">승인</button>' +
      '<button class="btn-reject" id="btn-reject">거절</button>' +
      '</div>' +
      '<div class="decision-note" id="decision-note"></div>' +
      '<div id="approval-error"></div>';

    document.getElementById('btn-approve').addEventListener('click', function () {
      if (MODE === 'live') {
        handleLiveApproval('approve', chosen);
        return;
      }
      approvalDecision = 'approved';
      document.getElementById('decision-note').textContent =
        '로컬 표시: 운영자가 ' + (chosen ? chosen.label : a.policy_id) + ' 정책을 승인했습니다. (fixture 데모, 실제 반영 없음)';
    });
    document.getElementById('btn-reject').addEventListener('click', function () {
      if (MODE === 'live') {
        handleLiveApproval('reject', chosen);
        return;
      }
      approvalDecision = 'rejected';
      document.getElementById('decision-note').textContent = '로컬 표시: 운영자가 제안을 거절했습니다. (fixture 데모, 실제 반영 없음)';
    });
    if (MODE !== 'live' && approvalDecision) {
      document.getElementById('decision-note').textContent =
        approvalDecision === 'approved'
          ? '로컬 표시: 운영자가 ' + (chosen ? chosen.label : a.policy_id) + ' 정책을 승인했습니다. (fixture 데모, 실제 반영 없음)'
          : '로컬 표시: 운영자가 제안을 거절했습니다. (fixture 데모, 실제 반영 없음)';
    }
  }

  function fetchWithTimeout(url, opts, ms) {
    opts = opts || {};
    if (typeof AbortController !== 'undefined') {
      var controller = new AbortController();
      var timeoutId = setTimeout(function () { controller.abort(); }, ms);
      opts.signal = controller.signal;
      return fetch(url, opts).then(function (resp) {
        clearTimeout(timeoutId);
        return resp;
      }, function (err) {
        clearTimeout(timeoutId);
        throw err;
      });
    }
    return fetch(url, opts);
  }

  function handleLiveApproval(decision, chosen) {
    var noteEl = document.getElementById('decision-note');
    var errEl = document.getElementById('approval-error');
    if (!noteEl || !chosen) return;
    noteEl.textContent = '요청 중...';
    if (errEl) errEl.innerHTML = '';
    fetchWithTimeout('/api/approvals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        run_id: DATA.run_id,
        policy_id: chosen.policy_id,
        decision: decision === 'approve' ? 'approve' : 'reject',
        operator: 'demo_operator',
        reason: ''
      })
    }, FIXTURE_TIMEOUT_MS).then(function (resp) {
      if (resp.status === 409) {
        return resp.json().then(function (body) {
          var detail = body.detail || {};
          var violations = detail.violations || [];
          noteEl.textContent = '승인 불가: ' + (detail.message || '안전·공정성 가드 위반');
          if (errEl) {
            errEl.innerHTML = violations.map(function (v) {
              return '<div class="violation"><code>' + v.code + '</code> ' + v.detail + '</div>';
            }).join('');
          }
        });
      }
      if (!resp.ok) { throw new Error('approval request failed: ' + resp.status); }
      return resp.json().then(function (result) {
        DATA.approval = result;
        noteEl.textContent = result.status === 'approved'
          ? '운영자가 ' + chosen.label + ' 정책을 승인했습니다. (live)'
          : '운영자가 제안을 거절했습니다. (live)';
      });
    }).catch(function () {
      noteEl.textContent = '승인 요청 실패(네트워크). 화면에는 반영되지 않았습니다.';
    });
  }

  // ---- recovery compare ----
  function renderRecovery() {
    var rc = DATA.recovery_compare;
    var wrap = document.getElementById('recovery-content');
    function col(title, kpi) {
      return '<div class="recovery-col"><h3>' + title + '</h3>' +
        KPI_DEFS.map(function (d) {
          return '<div class="row"><span>' + d.label + '</span><span>' + kpiValue(kpi, d) + '</span></div>';
        }).join('') + '</div>';
    }
    var imp = rc.improvement || {};
    wrap.innerHTML =
      '<div class="recovery-side">' + col('무대응', rc.no_action) + col('적용 (corridor_gating)', rc.applied) + '</div>' +
      '<div class="improvement-row">개선율: Spillback ' + pctSpan(imp.spillback_time_pct) +
      ' · 회복시간 ' + (
        rc.no_action.recovery_observed === false
          ? '<span class="pct-neutral">비교 보류(기준선 미회복)</span>'
          : pctSpan(imp.recovery_time_pct)
      ) +
      ' · 총 통행시간 ' + pctSpan(imp.total_travel_time_pct) +
      ' · 최악지체 ' + pctSpan(imp.worst_approach_delay_pct) + '</div>';
  }

  // ---- panel visibility per state ----
  function updatePanels(state) {
    document.getElementById('panel-policy').style.display = (state === 'policy_compare' || state === 'safety_review' || state === 'operator_approval' || state === 'recovery_compare') ? 'block' : 'none';
    document.getElementById('panel-safety').style.display = (state === 'safety_review' || state === 'operator_approval' || state === 'recovery_compare') ? 'block' : 'none';
    document.getElementById('panel-approval').style.display = (state === 'operator_approval' || state === 'recovery_compare') ? 'block' : 'none';
    document.getElementById('panel-recovery').style.display = (state === 'recovery_compare') ? 'block' : 'none';
  }

  // ---- KPI snapshot: choose kpi source based on state ----
  function kpiForState(state) {
    if (state === 'recovery_compare') return DATA.recovery_compare.applied;
    // before approval, show no_action baseline as "current trajectory" snapshot;
    // corridor_gating kpi shown once approval reached
    if (state === 'operator_approval' || state === 'safety_review' || state === 'policy_compare') {
      var cg = DATA.policies.filter(function (p) { return p.policy_id === 'corridor_gating'; })[0];
      return cg.kpi;
    }
    var na = DATA.policies.filter(function (p) { return p.policy_id === 'no_action'; })[0];
    return na.kpi;
  }

  function render() {
    var step = timeline[idx];
    var state = step.screen_state;

    document.getElementById('state-label').textContent =
      (idx + 1) + '/' + totalSteps + ' — ' + (STATE_LABELS[state] || state);
    document.getElementById('clock').textContent =
      't = ' + step.t_sec + '초 (실측 스케일) / 강우: ' + (step.rain_level || '-');

    updateCorridorState(step);
    renderKPI(kpiForState(state));
    updatePanels(state);

    if (state === 'policy_compare' || state === 'safety_review' || state === 'operator_approval' || state === 'recovery_compare') {
      renderPolicyTable();
    }
    if (state === 'safety_review' || state === 'operator_approval' || state === 'recovery_compare') {
      renderSafetyReview();
    }
    if (state === 'operator_approval' || state === 'recovery_compare') {
      renderApproval();
    }
    if (state === 'recovery_compare') {
      renderRecovery();
    }

    updateDots();
    document.getElementById('btn-prev').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === totalSteps - 1;
  }

  function goTo(newIdx) {
    idx = Math.max(0, Math.min(totalSteps - 1, newIdx));
    render();
  }

  function scheduleNext() {
    clearTimeout(timer);
    if (!playing) return;
    if (idx >= totalSteps - 1) { playing = false; updatePlayButton(); return; }
    timer = setTimeout(function () {
      idx = idx + 1;
      render();
      scheduleNext();
    }, STEP_DURATION_MS);
  }

  function updatePlayButton() {
    document.getElementById('btn-playpause').textContent = playing ? '일시정지' : '재생';
  }

  document.getElementById('btn-prev').addEventListener('click', function () {
    playing = false; updatePlayButton(); clearTimeout(timer);
    goTo(idx - 1);
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    playing = false; updatePlayButton(); clearTimeout(timer);
    goTo(idx + 1);
  });
  document.getElementById('btn-playpause').addEventListener('click', function () {
    playing = !playing;
    updatePlayButton();
    if (playing) {
      if (idx >= totalSteps - 1) { idx = 0; }
      render();
      scheduleNext();
    } else {
      clearTimeout(timer);
    }
  });

  // ---- badge / scenario notice ----
  function updateBadge(source) {
    var el = document.getElementById('badge-source');
    if (!el) return;
    el.textContent = 'result_source: ' + source;
    el.classList.toggle('fixture', source === 'fixture');
    el.classList.toggle('live', source !== 'fixture');
  }

  function showScenarioNotice(msg) {
    var el = document.getElementById('scenario-notice');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideScenarioNotice() {
    var el = document.getElementById('scenario-notice');
    if (!el) return;
    el.textContent = '';
    el.classList.remove('show');
  }

  // ---- live/fixture data adapter ----
  function isHttpProtocol() {
    return typeof location !== 'undefined' &&
      (location.protocol === 'http:' || location.protocol === 'https:');
  }

  // 라이브 timeline은 4개 상태(normal/rain_warning/spillback/recovery_compare)만
  // 샘플링에 등장한다 (backend/app/main.py:_screen_state_at). 대응안 비교/안전 가드/
  // 운영자 승인 3단계를 fixture처럼 데모에 노출하기 위해, spillback 마지막 지점
  // 직후에 동일 스냅샷을 복제한 합성 스텝을 끼워 넣는다. 실제 시뮬레이션 수치는
  // 그대로 유지되며 표시 목적의 화면 상태만 추가된다.
  function synthesizeDecisionSteps(run) {
    var tl = run.timeline || [];
    var hasDecisionStates = tl.some(function (s) {
      return s.screen_state === 'policy_compare' ||
        s.screen_state === 'safety_review' ||
        s.screen_state === 'operator_approval';
    });
    if (hasDecisionStates) return run;

    var lastSpillIdx = -1;
    for (var i = 0; i < tl.length; i++) {
      if (tl[i].screen_state === 'spillback') lastSpillIdx = i;
    }
    if (lastSpillIdx === -1) return run; // spillback 없는 시나리오(dry_base 등)는 그대로 둔다

    var base = tl[lastSpillIdx];
    var approvalPolicyId = run.approval && run.approval.policy_id;
    var extraDefs = [
      { state: 'policy_compare', note: '대응안 3종 비교 제시' },
      { state: 'safety_review', note: '안전·공정성 가드 판정' },
      { state: 'operator_approval', note: '운영자 승인 대기: ' + (approvalPolicyId || '') }
    ];
    var extra = extraDefs.map(function (def, k) {
      var clone = JSON.parse(JSON.stringify(base));
      clone.screen_state = def.state;
      clone.t_sec = base.t_sec + (k + 1);
      clone.note = def.note;
      return clone;
    });
    var newTl = tl.slice(0, lastSpillIdx + 1).concat(extra, tl.slice(lastSpillIdx + 1));
    run.timeline = newTl;
    return run;
  }

  function loadLiveRun(scenarioId) {
    return fetchWithTimeout('/api/simulations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario_id: scenarioId, seed: 42 })
    }, FIXTURE_TIMEOUT_MS).then(function (resp) {
      if (!resp.ok) throw new Error('simulations POST failed: ' + resp.status);
      return resp.json();
    }).then(function (created) {
      return fetchWithTimeout('/api/simulations/' + created.run_id, {}, FIXTURE_TIMEOUT_MS)
        .then(function (getResp) {
          if (!getResp.ok) throw new Error('simulations GET failed: ' + getResp.status);
          return getResp.json();
        }).then(function (run) {
          run = synthesizeDecisionSteps(run);
          return { run: run, resultSource: created.result_source || run.result_source || 'live_simulation' };
        });
    });
  }

  function init(data, mode, resultSource) {
    DATA = data;
    MODE = mode;
    timeline = DATA.timeline;
    totalSteps = timeline.length;
    STEP_DURATION_MS = Math.round(180000 / Math.max(totalSteps, 1));
    idx = 0;
    playing = true;
    approvalDecision = null;
    clearTimeout(timer);

    document.getElementById('run-id').textContent = DATA.run_id;
    document.getElementById('scenario-sub').textContent =
      '시나리오: ' + DATA.scenario.scenario_id + ' · seed ' + DATA.scenario.seed +
      ' · 강우 ' + DATA.scenario.rain_level + ' · network ' + (DATA.network_version || '');
    updateBadge(resultSource || DATA.result_source || 'fixture');

    var picker = document.getElementById('scenario-picker');
    if (picker) picker.value = CURRENT_SCENARIO;

    rebuildDots();
    updatePlayButton();
    renderCorridorSVG();
    renderCorridorVerification();
    render();
    scheduleNext();
  }

  // ---- scenario picker ----
  var scenarioPicker = document.getElementById('scenario-picker');
  if (scenarioPicker) {
    scenarioPicker.addEventListener('change', function (e) {
      var chosen = e.target.value;
      if (MODE !== 'live') {
        if (chosen !== 'rain_spillback_a') {
          showScenarioNotice('fixture는 rain_spillback_a만 제공합니다. 다른 시나리오는 백엔드(live) 연결 시 이용할 수 있습니다.');
          e.target.value = 'rain_spillback_a';
        } else {
          hideScenarioNotice();
        }
        return;
      }
      hideScenarioNotice();
      scenarioPicker.disabled = true;
      loadLiveRun(chosen).then(function (res) {
        CURRENT_SCENARIO = chosen;
        init(res.run, 'live', res.resultSource);
      }).catch(function () {
        showScenarioNotice('시나리오 요청 실패. 이전 데이터를 유지합니다.');
        e.target.value = CURRENT_SCENARIO;
      }).then(function () {
        scenarioPicker.disabled = false;
      });
    });
  }

  // ---- bootstrap: live fetch with fixture fallback ----
  function bootstrap() {
    if (!isHttpProtocol()) {
      init(FIXTURE, 'fixture', 'fixture');
      return;
    }
    loadLiveRun(CURRENT_SCENARIO).then(function (res) {
      init(res.run, 'live', res.resultSource);
    }).catch(function () {
      init(FIXTURE, 'fixture', 'fixture');
    });
  }

  bootstrap();
})();
</script>
</body>
